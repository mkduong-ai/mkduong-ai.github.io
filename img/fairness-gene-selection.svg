<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="geneOneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="geneZeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="gaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="#f1f5f9"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="960" height="56" rx="16" fill="url(#headerGrad)"/>
  <rect x="0" y="40" width="960" height="16" fill="url(#headerGrad)"/>
  <text x="480" y="35" fill="#ffffff" font-family="'Roboto', system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0.5">Combinatorial Optimization: Finding the Optimal 0/1 Gene for Fairness</text>

  <!-- Step 1: Input Dataset -->
  <g transform="translate(40, 85)" filter="url(#shadow)">
    <rect width="210" height="350" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="42" rx="12" fill="#e2e8f0"/>
    <rect x="0" y="30" width="210" height="12" fill="#e2e8f0"/>
    <text x="105" y="27" fill="#1e293b" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. Input Dataset (S)</text>

    <!-- Data Rows -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="178" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="22" fill="#334155" font-family="monospace" font-size="12">Sample s₁ (Group A)</text>

      <rect x="0" y="44" width="178" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="66" fill="#334155" font-family="monospace" font-size="12">Sample s₂ (Biased)</text>

      <rect x="0" y="88" width="178" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="110" fill="#334155" font-family="monospace" font-size="12">Sample s₃ (Group B)</text>

      <rect x="0" y="132" width="178" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="154" fill="#334155" font-family="monospace" font-size="12">Sample s₄ (Group C)</text>

      <rect x="0" y="176" width="178" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="198" fill="#334155" font-family="monospace" font-size="12">Sample s₅ (Biased)</text>

      <text x="89" y="240" fill="#94a3b8" font-family="monospace" font-size="16" text-anchor="middle">⋮</text>

      <rect x="0" y="250" width="178" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="272" fill="#334155" font-family="monospace" font-size="12">Sample sₙ (Group A)</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 260 260 L 290 260" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 2: Binary Gene (0/1 Mask) -->
  <g transform="translate(300, 85)" filter="url(#shadow)">
    <rect width="180" height="350" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="42" rx="12" fill="#dbeafe"/>
    <rect x="0" y="30" width="180" height="12" fill="#dbeafe"/>
    <text x="90" y="27" fill="#1e40af" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. Candidate Gene (b)</text>

    <!-- Gene Bits -->
    <g transform="translate(18, 56)">
      <!-- Bit 1 = 1 (Keep) -->
      <rect x="0" y="0" width="144" height="34" rx="6" fill="url(#geneOneGrad)"/>
      <text x="72" y="22" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" text-anchor="middle">b₁ = 1 (Keep)</text>

      <!-- Bit 2 = 0 (Remove) -->
      <rect x="0" y="44" width="144" height="34" rx="6" fill="url(#geneZeroGrad)"/>
      <text x="72" y="66" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" text-anchor="middle">b₂ = 0 (Remove)</text>

      <!-- Bit 3 = 1 (Keep) -->
      <rect x="0" y="88" width="144" height="34" rx="6" fill="url(#geneOneGrad)"/>
      <text x="72" y="110" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" text-anchor="middle">b₃ = 1 (Keep)</text>

      <!-- Bit 4 = 1 (Keep) -->
      <rect x="0" y="132" width="144" height="34" rx="6" fill="url(#geneOneGrad)"/>
      <text x="72" y="154" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" text-anchor="middle">b₄ = 1 (Keep)</text>

      <!-- Bit 5 = 0 (Remove) -->
      <rect x="0" y="176" width="144" height="34" rx="6" fill="url(#geneZeroGrad)"/>
      <text x="72" y="198" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" text-anchor="middle">b₅ = 0 (Remove)</text>

      <text x="72" y="240" fill="#94a3b8" font-family="monospace" font-size="16" text-anchor="middle">⋮</text>

      <!-- Bit n = 1 (Keep) -->
      <rect x="0" y="250" width="144" height="34" rx="6" fill="url(#geneOneGrad)"/>
      <text x="72" y="272" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" text-anchor="middle">bₙ = 1 (Keep)</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 490 260 L 520 260" stroke="#64748b" stroke-width="2.5"/>

  <!-- Step 3: Genetic Algorithm (Heuristic Search) -->
  <g transform="translate(530, 85)" filter="url(#shadow)">
    <rect width="180" height="350" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="42" rx="12" fill="#ede9fe"/>
    <rect x="0" y="30" width="180" height="12" fill="#ede9fe"/>
    <text x="90" y="27" fill="#5b21b6" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. Genetic Algorithm</text>

    <g transform="translate(12, 60)">
      <!-- Population Evolution Box -->
      <rect x="0" y="0" width="156" height="60" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="78" y="24" fill="#4c1d95" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Evolution Loop</text>
      <text x="78" y="44" fill="#6d28d9" font-family="'Roboto', sans-serif" font-size="11" text-anchor="middle">Population of Bitstrings</text>

      <!-- Operators -->
      <g transform="translate(0, 75)">
        <rect x="0" y="0" width="156" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="78" y="17" fill="#334155" font-family="'Roboto', sans-serif" font-size="11" text-anchor="middle">1. Elitist Selection</text>

        <rect x="0" y="34" width="156" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="78" y="51" fill="#334155" font-family="'Roboto', sans-serif" font-size="11" text-anchor="middle">2. Uniform Crossover</text>

        <rect x="0" y="68" width="156" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="78" y="85" fill="#334155" font-family="'Roboto', sans-serif" font-size="11" text-anchor="middle">3. Bit-Flip Mutation</text>
      </g>

      <!-- Black-Box Evaluator -->
      <g transform="translate(0, 190)">
        <rect x="0" y="0" width="156" height="75" rx="8" fill="#1e1b4b" stroke="#312e81"/>
        <text x="78" y="22" fill="#c7d2fe" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Black-Box Evaluator</text>
        <text x="78" y="42" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">f(b) = ψ(D_fair)</text>
        <text x="78" y="62" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="10" text-anchor="middle">No gradients required!</text>
      </g>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 720 260 L 750 260" stroke="#64748b" stroke-width="2.5"/>

  <!-- Step 4: Fair Subset Output -->
  <g transform="translate(760, 85)" filter="url(#shadow)">
    <rect width="160" height="350" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="42" rx="12" fill="#d1fae5"/>
    <rect x="0" y="30" width="160" height="12" fill="#d1fae5"/>
    <text x="80" y="27" fill="#065f46" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" text-anchor="middle">4. Fair Dataset (D_fair)</text>

    <!-- Filtered Data Rows -->
    <g transform="translate(12, 56)">
      <rect x="0" y="0" width="136" height="34" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="68" y="22" fill="#065f46" font-family="monospace" font-size="11" text-anchor="middle">Sample s₁ (✓)</text>

      <rect x="0" y="44" width="136" height="34" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="68" y="66" fill="#065f46" font-family="monospace" font-size="11" text-anchor="middle">Sample s₃ (✓)</text>

      <rect x="0" y="88" width="136" height="34" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="68" y="110" fill="#065f46" font-family="monospace" font-size="11" text-anchor="middle">Sample s₄ (✓)</text>

      <text x="68" y="150" fill="#94a3b8" font-family="monospace" font-size="16" text-anchor="middle">⋮</text>

      <rect x="0" y="170" width="136" height="34" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="68" y="192" fill="#065f46" font-family="monospace" font-size="11" text-anchor="middle">Sample sₙ (✓)</text>

      <!-- Badge Result -->
      <rect x="0" y="220" width="136" height="60" rx="8" fill="#065f46"/>
      <text x="68" y="244" fill="#a7f3d0" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Min Discrimination</text>
      <text x="68" y="264" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="11" text-anchor="middle">ψ(D_fair) ≈ 0</text>
    </g>
  </g>
</svg>
