<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0d3b66" />
      <stop offset="100%" stop-color="#152642" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>
    <linearGradient id="paretoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b2b" />
      <stop offset="100%" stop-color="#ff416c" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Background Graphic: Decorative Flow / Graph -->
  <g opacity="0.35">
    <circle cx="1000" cy="200" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="6,6" />
    <circle cx="1000" cy="200" r="120" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    
    <!-- Decision Tree Branches -->
    <path d="M 860 380 L 960 320 L 1080 320" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 960 320 L 1040 240 L 1120 240" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 960 320 L 1040 390 L 1120 390" fill="none" stroke="#00f2fe" stroke-width="2" />
    <path d="M 860 380 L 960 450 L 1070 450" fill="none" stroke="#fda085" stroke-width="2" />
    
    <!-- Nodes -->
    <circle cx="860" cy="380" r="8" fill="#4facfe" />
    <circle cx="960" cy="320" r="7" fill="#00f2fe" />
    <circle cx="1040" cy="240" r="6" fill="#fff" />
    <circle cx="1040" cy="390" r="6" fill="#00f2fe" />
    <circle cx="960" cy="450" r="7" fill="#fda085" />
    <circle cx="1070" cy="450" r="6" fill="#f6d365" />
    <circle cx="1120" cy="240" r="5" fill="#4facfe" />
    <circle cx="1120" cy="390" r="5" fill="#4facfe" />

    <!-- Pareto Frontier Curve -->
    <path d="M 820 540 Q 940 520 1020 420 T 1140 160" fill="none" stroke="url(#paretoGrad)" stroke-width="3.5" filter="url(#glow)" />
    <!--<text x="800" y="445" fill="#ff416c" font-family="'Roboto', sans-serif" font-size="14" font-weight="600" letter-spacing="1">PARETO OPTIMAL FAIRNESS</text>--> 
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 140)">
    <!-- Badges -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="34" rx="17" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1.2" />
      <text x="70" y="22" fill="#00f2fe" font-family="'Roboto', sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">BMBF PROJECT</text>

      <rect x="155" y="0" width="150" height="34" rx="17" fill="rgba(253, 160, 133, 0.15)" stroke="#fda085" stroke-width="1.2" />
      <text x="230" y="22" fill="#fda085" font-family="'Roboto', sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">RESPONSIBLE AI</text>

      <rect x="320" y="0" width="110" height="34" rx="17" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1" />
      <text x="375" y="22" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="14" font-weight="500" text-anchor="middle">2021 – 2024</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="110" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="68" font-weight="800" letter-spacing="2">RAPP</text>
    <text x="0" y="170" fill="url(#cyanGrad)" font-family="'Roboto', sans-serif" font-size="34" font-weight="600">Responsible Academic Performance Prediction</text>
    
    <!-- Subtitle / Mission -->
    <text x="0" y="220" fill="#e0e6ed" font-family="'Roboto', sans-serif" font-size="20" font-weight="400">
      <tspan x="0" dy="0">Ethical AI Decision Support • Fair Machine Learning</tspan>
      <tspan x="0" dy="30">Explainable AI (xAI) • Interpretable AI</tspan>
      <tspan x="0" dy="30">MLOps • DevOps • Human-in-the-Loop</tspan>
    </text>

    <!-- Tech Stack Pill Highlights -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="105" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="52.5" y="21" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="14" font-weight="500" text-anchor="middle">Python</text>

      <rect x="115" y="0" width="110" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="170" y="21" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="14" font-weight="500" text-anchor="middle">PyTorch</text>

      <rect x="235" y="0" width="130" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="300" y="21" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="14" font-weight="500" text-anchor="middle">Scikit-learn</text>

      <rect x="375" y="0" width="135" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="442.5" y="21" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="14" font-weight="500" text-anchor="middle">PostgreSQL</text>

      <rect x="520" y="0" width="115" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="577.5" y="21" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="14" font-weight="500" text-anchor="middle">Flask</text>
    </g>
  </g>
</svg>
