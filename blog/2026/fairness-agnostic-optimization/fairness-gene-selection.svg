<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="geneOneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="geneZeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="980" height="470" rx="10" fill="#f8fafc"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="980" height="48" rx="10" fill="url(#headerGrad)"/>
  <rect x="0" y="32" width="980" height="16" fill="url(#headerGrad)"/>
  <text x="490" y="30" fill="#ffffff" font-family="'Roboto', system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">Combinatorial Optimization: Finding the Optimal Chromosome for Fairness</text>

  <!-- 1. Input Dataset Card -->
  <g transform="translate(14, 60)">
    <rect width="218" height="395" rx="10" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="218" height="42" rx="10" fill="#e2e8f0"/>
    <rect x="0" y="30" width="218" height="12" fill="#e2e8f0"/>
    <text x="109" y="27" fill="#0f172a" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" text-anchor="middle">1. Input Dataset (S)</text>

    <!-- Data Rows -->
    <g transform="translate(12, 54)">
      <rect x="0" y="0" width="194" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="12" y="25" fill="#1e293b" font-family="monospace" font-size="14" font-weight="600">Sample s₁ (Group A)</text>

      <rect x="0" y="48" width="194" height="40" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
      <text x="12" y="73" fill="#991b1b" font-family="monospace" font-size="14" font-weight="600">Sample s₂ (Biased)</text>

      <rect x="0" y="96" width="194" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="12" y="121" fill="#1e293b" font-family="monospace" font-size="14" font-weight="600">Sample s₃ (Group B)</text>

      <rect x="0" y="144" width="194" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="12" y="169" fill="#1e293b" font-family="monospace" font-size="14" font-weight="600">Sample s₄ (Group C)</text>

      <rect x="0" y="192" width="194" height="40" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
      <text x="12" y="217" fill="#991b1b" font-family="monospace" font-size="14" font-weight="600">Sample s₅ (Biased)</text>

      <text x="97" y="260" fill="#64748b" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle">⋮</text>

      <rect x="0" y="276" width="194" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="12" y="301" fill="#1e293b" font-family="monospace" font-size="14" font-weight="600">Sample sₙ (Group A)</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="237" y1="255" x2="253" y2="255" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 2. Candidate Gene Card -->
  <g transform="translate(258, 60)">
    <rect width="190" height="395" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="190" height="42" rx="10" fill="#dbeafe"/>
    <rect x="0" y="30" width="190" height="12" fill="#dbeafe"/>
    <text x="95" y="27" fill="#1e40af" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" text-anchor="middle">2. Candidate Gene (b)</text>

    <!-- Gene Bits -->
    <g transform="translate(12, 54)">
      <!-- Bit 1 -->
      <rect x="0" y="0" width="166" height="40" rx="6" fill="url(#geneOneGrad)"/>
      <text x="83" y="25" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" text-anchor="middle">b₁ = 1  (Keep)</text>

      <!-- Bit 2 -->
      <rect x="0" y="48" width="166" height="40" rx="6" fill="url(#geneZeroGrad)"/>
      <text x="83" y="73" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" text-anchor="middle">b₂ = 0  (Remove)</text>

      <!-- Bit 3 -->
      <rect x="0" y="96" width="166" height="40" rx="6" fill="url(#geneOneGrad)"/>
      <text x="83" y="121" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" text-anchor="middle">b₃ = 1  (Keep)</text>

      <!-- Bit 4 -->
      <rect x="0" y="144" width="166" height="40" rx="6" fill="url(#geneOneGrad)"/>
      <text x="83" y="169" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" text-anchor="middle">b₄ = 1  (Keep)</text>

      <!-- Bit 5 -->
      <rect x="0" y="192" width="166" height="40" rx="6" fill="url(#geneZeroGrad)"/>
      <text x="83" y="217" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" text-anchor="middle">b₅ = 0  (Remove)</text>

      <text x="83" y="260" fill="#64748b" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle">⋮</text>

      <!-- Bit n -->
      <rect x="0" y="276" width="166" height="40" rx="6" fill="url(#geneOneGrad)"/>
      <text x="83" y="301" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" text-anchor="middle">bₙ = 1  (Keep)</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="453" y1="255" x2="469" y2="255" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 3. Genetic Algorithm Optimizer Card -->
  <g transform="translate(474, 60)">
    <rect width="248" height="395" rx="10" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="248" height="42" rx="10" fill="#ede9fe"/>
    <rect x="0" y="30" width="248" height="12" fill="#ede9fe"/>
    <text x="124" y="27" fill="#5b21b6" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" text-anchor="middle">3. Genetic Algorithm</text>

    <g transform="translate(12, 54)">
      <!-- GA Evolution Header -->
      <rect x="0" y="0" width="224" height="60" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
      <text x="112" y="24" fill="#4c1d95" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Evolution Loop</text>
      <text x="112" y="46" fill="#6d28d9" font-family="'Roboto', sans-serif" font-size="13" font-weight="500" text-anchor="middle">Evolves pool of binary bitstrings</text>

      <!-- Operators List -->
      <g transform="translate(0, 70)">
        <rect x="0" y="0" width="224" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="112" y="20" fill="#1e293b" font-family="'Roboto', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">1. Elitist Selection</text>

        <rect x="0" y="36" width="224" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="112" y="56" fill="#1e293b" font-family="'Roboto', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">2. Uniform Crossover</text>

        <rect x="0" y="72" width="224" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="112" y="92" fill="#1e293b" font-family="'Roboto', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">3. Bit-Flip Mutation (5%)</text>
      </g>

      <!-- Black-Box Evaluator -->
      <g transform="translate(0, 190)">
        <rect x="0" y="0" width="224" height="126" rx="8" fill="url(#evalGrad)" stroke="#312e81" stroke-width="1.5"/>
        <text x="112" y="28" fill="#e0e7ff" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Black-Box Evaluator</text>
        <rect x="16" y="40" width="192" height="38" rx="6" fill="#312e81"/>
        <text x="112" y="65" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">f(b) = ψ(D_fair)</text>
        <text x="112" y="98" fill="#a5f3fc" font-family="'Roboto', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">✓ No Gradients Required</text>
        <text x="112" y="115" fill="#cbd5e1" font-family="'Roboto', sans-serif" font-size="11.5" text-anchor="middle">Works with ANY fairness metric</text>
      </g>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="727" y1="255" x2="743" y2="255" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 4. Output Fair Dataset Card -->
  <g transform="translate(748, 60)">
    <rect width="218" height="395" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="218" height="42" rx="10" fill="#d1fae5"/>
    <rect x="0" y="30" width="218" height="12" fill="#d1fae5"/>
    <text x="109" y="27" fill="#065f46" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" text-anchor="middle">4. Fair Dataset (D_fair)</text>

    <!-- Filtered Data Rows -->
    <g transform="translate(12, 54)">
      <rect x="0" y="0" width="194" height="40" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
      <text x="12" y="25" fill="#065f46" font-family="monospace" font-size="14" font-weight="600">Sample s₁ (Included)</text>

      <rect x="0" y="48" width="194" height="40" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
      <text x="12" y="73" fill="#065f46" font-family="monospace" font-size="14" font-weight="600">Sample s₃ (Included)</text>

      <rect x="0" y="96" width="194" height="40" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
      <text x="12" y="121" fill="#065f46" font-family="monospace" font-size="14" font-weight="600">Sample s₄ (Included)</text>

      <text x="97" y="160" fill="#64748b" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle">⋮</text>

      <rect x="0" y="180" width="194" height="40" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
      <text x="12" y="205" fill="#065f46" font-family="monospace" font-size="14" font-weight="600">Sample sₙ (Included)</text>

      <!-- Outcome Highlight Box -->
      <g transform="translate(0, 236)">
        <rect x="0" y="0" width="194" height="80" rx="8" fill="#065f46"/>
        <text x="97" y="28" fill="#a7f3d0" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Optimal Fair Subset</text>
        <text x="97" y="52" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Min Discrimination</text>
        <text x="97" y="70" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">ψ(D_fair) ≈ 0</text>
      </g>
    </g>
  </g>
</svg>
