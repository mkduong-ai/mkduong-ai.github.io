<!-- Contact Section -->
<section id="contact" class="section white">
    <div class="container">
        <h3 class="center-align">Get In Touch</h3>
        <div class="row">
            <div class="col s12 m8 offset-m2">
                <div class="card">
                    <div class="card-content">
                        <div class="row">
                            <div class="col s12 m4 center-align">
                                <i class="material-icons contact-icon">email</i>
                                <p>john.doe@email.com</p>
                            </div>
                            <div class="col s12 m4 center-align">
                                <i class="material-icons contact-icon">phone</i>
                                <p>+1 (555) 123-4567</p>
                            </div>
                            <div class="col s12 m4 center-align">
                                <i class="material-icons contact-icon">location_on</i>
                                <p>San Francisco, CA</p>
                            </div>
                        </div>
                        <form>
                            <div class="row">
                                <div class="input-field col s12 m6">
                                    <input id="name" type="text" class="validate">
                                    <label for="name">Your Name</label>
                                </div>
                                <div class="input-field col s12 m6">
                                    <input id="email" type="email" class="validate">
                                    <label for="email">Your Email</label>
                                </div>
                            </div>
                            <div class="row">
                                <div class="input-field col s12">
                                    <textarea id="message" class="materialize-textarea"></textarea>
                                    <label for="message">Your Message</label>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col s12 center-align">
                                    <button class="btn waves-effect waves-light blue" type="submit">
                                        Send Message
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
